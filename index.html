<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stash</title>
  <meta name="theme-color" content="#121316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stash">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="scroll" id="scroll">
  <main class="app">
    <header class="top">
      <div class="brand-row">
        <div class="brand">Stash</div>
        <div class="version" id="version">v0.4.0</div>
      </div>
      <button class="icon-btn icon-btn-accent" id="btn-plus" type="button" data-i18n-aria="empty.btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </header>

    <!-- Нет целей -->
    <section class="card empty" id="view-empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
          <circle cx="32" cy="32" r="22" opacity=".35"/>
          <path d="M32 10a22 22 0 0 1 22 22"/>
        </svg>
      </div>
      <h1 data-i18n="empty.title"></h1>
      <p data-i18n="empty.text"></p>
      <button class="btn btn-accent" id="btn-create" type="button" data-i18n="empty.btn"></button>
    </section>

    <!-- Список целей -->
    <section class="list" id="view-list" hidden></section>

    <!-- Одна цель -->
    <section class="card goal" id="view-goal" hidden>
      <div class="goal-head">
        <button class="icon-btn icon-btn-soft" id="btn-back" type="button" data-i18n-aria="aria.back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="goal-name-wrap"><div class="goal-name" id="goal-name"></div></div>
        <button class="icon-btn icon-btn-soft icon-btn-danger" id="btn-delete" type="button" data-i18n-aria="aria.delete">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/>
            <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>
            <path d="M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7"/>
            <path d="M10 11v5M14 11v5"/>
          </svg>
        </button>
      </div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-bg" cx="110" cy="110" r="96"/>
          <circle class="ring-fg" id="ring-fg" cx="110" cy="110" r="96"/>
        </svg>
        <div class="ring-center">
          <div class="percent" id="percent">0%</div>
          <div class="done-tag" id="done-tag" data-i18n="goal.done" hidden></div>
        </div>
      </div>
      <div class="saved" id="saved"></div>
      <div class="of" id="of"></div>
      <div class="actions">
        <button class="btn btn-accent" id="btn-add" type="button" data-i18n="act.add"></button>
        <button class="btn btn-soft" id="btn-take" type="button" data-i18n="act.take"></button>
      </div>
    </section>

    <!-- Стратегии (пока только отображение) -->
    <section class="panel" id="view-strategies" hidden>
      <h2 class="panel-title" data-i18n="tab.strategies"></h2>
      <div id="strat-body"></div>
    </section>

    <!-- Настройки -->
    <section class="panel" id="view-settings" hidden>
      <h2 class="panel-title" data-i18n="tab.settings"></h2>
      <div class="rows" id="set-body"></div>
    </section>
  </main>
  </div>

  <!-- Нижнее меню -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-dot" aria-hidden="true"></span>
    <button class="tab active" type="button" data-tab="list">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>
      </svg>
      <span id="tab-goals-label"></span>
    </button>
    <button class="tab" type="button" data-tab="strategies">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4v14.5A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 15l4-4.5 3 3L20 8"/><path d="M15.5 8H20v4.5"/>
      </svg>
      <span data-i18n="tab.strategies"></span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span data-i18n="tab.settings"></span>
    </button>
  </nav>

  <!-- Окно (создание цели / внести / снять / удалить) -->
  <div class="overlay" id="overlay" hidden>
    <form class="sheet" id="sheet" autocomplete="off" novalidate>
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-text" id="sheet-text" hidden></div>
      <label class="field" id="field-name">
        <span data-i18n="field.name"></span>
        <input id="in-name" type="text" maxlength="30" data-i18n-ph="field.name.ph">
      </label>
      <label class="field" id="field-amount">
        <span id="amount-label"></span>
        <input id="in-amount" type="text" inputmode="decimal" placeholder="0">
      </label>
      <div class="error" id="error" hidden></div>
      <div class="sheet-actions">
        <button class="btn btn-accent" id="sheet-ok" type="submit"></button>
        <button class="btn btn-soft" id="sheet-cancel" type="button" data-i18n="btn.cancel"></button>
      </div>
    </form>
  </div>

  <!-- Окно выбора (валюта / язык / иконка) -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet sheet-tall" id="picker">
      <div class="sheet-title" id="pick-title"></div>
      <label class="field pick-search" id="pick-search-wrap">
        <input id="pick-search" type="search" autocomplete="off" autocapitalize="off" data-i18n-ph="pick.search">
      </label>
      <div class="pick-scroll" id="pick-scroll"><div id="pick-list"></div></div>
      <div class="pick-note" id="pick-note" hidden></div>
      <button class="btn btn-soft" id="pick-close" type="button" data-i18n="pick.done"></button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/zh.js"></script>
  <script src="js/locales/hi.js"></script>
  <script src="js/locales/es.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/locales/ar.js"></script>
  <script src="js/locales/bn.js"></script>
  <script src="js/locales/pt.js"></script>
  <script src="js/locales/ru.js"></script>
  <script src="js/locales/ur.js"></script>
  <script src="js/locales/id.js"></script>
  <script src="js/locales/de.js"></script>
  <script src="js/locales/ja.js"></script>
  <script src="js/locales/mr.js"></script>
  <script src="js/locales/te.js"></script>
  <script src="js/locales/tr.js"></script>
  <script src="js/locales/ta.js"></script>
  <script src="js/locales/vi.js"></script>
  <script src="js/locales/ko.js"></script>
  <script src="js/locales/it.js"></script>
  <script src="js/locales/th.js"></script>
  <script src="js/locales/fa.js"></script>
  <script src="js/locales/pl.js"></script>
  <script src="js/locales/uk.js"></script>
  <script src="js/locales/nl.js"></script>
  <script src="js/currencies.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
